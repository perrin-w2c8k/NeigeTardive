name: "Main"
on:
  push: {}
jobs:
  check:
    name: "Check"
    runs-on: ubuntu-latest
    steps:
      - name: "load"
        uses: actions/checkout@v3

      - name: "go"
        run: |
          chmod +x scaffold
          ./scaffold
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}

